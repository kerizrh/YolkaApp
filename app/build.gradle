plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def yolkaBaseUrl = localProperties.getProperty('YOLKA_BASE_URL', 'http://10.0.2.2:8080/api/v1/')
def yolkaStoreSecret = localProperties.getProperty('YOLKA_STORE_SECRET_KEY', 'YolkaDefaultLocalDevKey32Bytes!!')
def googleWebClientId = localProperties.getProperty('GOOGLE_WEB_CLIENT_ID', '')

android {
    namespace 'com.yolka.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.yolka.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "BASE_URL", "\"${yolkaBaseUrl}\""
        buildConfigField "String", "SECRET_KEY", "\"${yolkaStoreSecret}\""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${googleWebClientId}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'

    // Networking: Retrofit 2 + OkHttp + Gson
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Almacenamiento seguro local (Store Singleton)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Carga y caché de imágenes (funciona también en modo parcialmente offline)
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Geolocalización y Mapa OpenStreetMap (Módulo 6)
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Google Sign-In (Módulo 1)
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // Firebase Cloud Messaging (Módulo 8)
    implementation 'com.google.firebase:firebase-messaging:24.0.0'

    testImplementation 'junit:junit:4.13.2'
}
